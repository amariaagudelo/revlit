baseURL = "https://amariaagudelo.github.io/revlit/"
languageCode = "es-co"
title = "Revistas en red"

[module]
  [[module.imports]]
    path = "github.com/willfaught/paige"

[markup.highlight]
  noclasses = false
  style = "github"

[markup.goldmark.renderer]
  unsafe = true

[taxonomies]
  category = "categories"
  tag = "tags"
  ciudad = "ciudades"
  repositorio = "repositorios"

[menu]
  [[menu.main]]
    name = "Inicio"
    pageRef = "/"
    weight = 10 # Primero

  [[menu.main]]
    name = "Acerca"
    pageRef = "/proyecto"
    weight = 20 # Segundo

  [[menu.main]]
    name = "Equipo"
    pageRef = "/equipo"
    weight = 30 # Tercero

  [[menu.main]]
    name = "Resultados"
    pageRef = "/analisis"
    weight = 40 # Cuarto

  [[menu.main]]
    name = "Revistas digitalizadas"
    pageRef = "/archivo"
    weight = 50 # Quinto

