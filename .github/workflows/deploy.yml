# Archivo: .github/workflows/deploy.yml
name: Deploy Hugo site to Pages

on:
  # Se ejecuta en pushes a la rama 'main'
  push:
    branches:
      - main 
  # Permite ejecutarlo manualmente desde la pestaña Actions en GitHub
  workflow_dispatch:

# Permisos para el GITHUB_TOKEN
permissions:
  contents: read
  pages: write
  id-token: write

# Permite un solo despliegue concurrente, cancela los anteriores
concurrency:
  group: "pages"
  cancel-in-progress: false

# Variables de entorno por defecto
defaults:
  run:
    shell: bash

jobs:
  # Job de construcción
  build:
    runs-on: ubuntu-latest # Usa un servidor Linux virtual
    env:
      HUGO_VERSION: 0.151.2 # Usa la misma versión de Hugo que tienes localmente (¡Verifica!)
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb          
      - name: Install Dart Sass
        run: sudo snap install dart-sass # Instala el compilador Sass
      - name: Checkout code
        uses: actions/checkout@v4 # Descarga tu código
        with:
          submodules: true # Descarga módulos del tema si usaras submódulos (buena práctica tenerlo)
          fetch-depth: 0 
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5 # Configura GitHub Pages
      - name: Install node dependencies (si tuvieras assets que lo necesiten)
        # run: npm install # Descomenta si usas JS que requiera npm
      - name: Update Hugo Modules
        run: hugo mod tidy # Asegura que los módulos del tema estén actualizados
      - name: Build with Hugo
        env:
          # Fuerza a Hugo a usar la baseURL correcta para GitHub Pages
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: |
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" # Construye el sitio en /public
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 # Sube la carpeta /public generada
        with:
          path: ./public

  # Job de despliegue
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # Depende de que el job 'build' termine
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 # Despliega el artifact subido