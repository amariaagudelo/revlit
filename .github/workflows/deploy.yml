# Archivo: .github/workflows/deploy.yml
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Usaremos una versión de Hugo instalada por la action
      HUGO_VERSION: 0.151.2
      # Y una versión fija de Dart Sass
      SASS_VERSION: 1.77.8
    steps:
      # 1. Instalar Hugo (método 'peaceiris' que SÍ funciona)
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # 2. Instalar Dart Sass (Método manual a /usr/local/bin)
      - name: Install Dart Sass
        run: |
          echo "Descargando Dart Sass v${{ env.SASS_VERSION }}"
          # Descargamos el archivo tar.gz
          curl -LJO "https://github.com/sass/dart-sass/releases/download/${{ env.SASS_VERSION }}/dart-sass-${{ env.SASS_VERSION }}-linux-x64.tar.gz"
          
          echo "Extrayendo..."
          tar -xzf "dart-sass-${{ env.SASS_VERSION }}-linux-x64.tar.gz"
          
          echo "Moviendo el ejecutable a /usr/local/bin/"
          # Movemos el contenido de la carpeta 'dart-sass' (que incluye el ejecutable 'sass')
          # a un directorio que SÍ está en el PATH del sistema.
          sudo mv dart-sass/* /usr/local/bin/
          
          echo "Limpiando archivos..."
          rm -rf "dart-sass-${{ env.SASS_VERSION }}-linux-x64.tar.gz" dart-sass

      # 3. Verificar que AMBOS se instalaron
      - name: Verify Installations
        run: |
          echo "Verificando Hugo:"
          hugo version
          echo "Verificando Sass (ahora en /usr/local/bin):"
          which sass # Este comando nos dirá la ruta exacta
          sass --version
          
      # 4. Descargar tu código
      - name: Checkout code 
        uses: actions/checkout@v4
        with:
          submodules: true 
          fetch-depth: 0 

      # 5. Configurar GitHub Pages
      - name: Setup Pages 
        id: pages
        uses: actions/configure-pages@v5 
        
      # 6. Descargar el tema Paige (Hugo Modules)
      - name: Update Hugo Modules 
        run: hugo mod tidy 
        
      # 7. Construir el sitio
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: | 
          hugo --environment production --minify --baseURL "${{ steps.pages.outputs.base_url }}/" 
          
      # 8. Subir el artefacto
      - name: Upload artifact 
        uses: actions/upload-pages-artifact@v3 
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4