# Archivo: .github/workflows/deploy.yml
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Mantenemos la versión de Hugo que sabemos funciona
      HUGO_VERSION: 0.151.2 
    steps:
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # PASO NUEVO: Instala Dart Sass globalmente
      - name: Setup Dart Sass
        uses: dart-sass/setup-dart-sass@v2

      - name: Checkout code 
        uses: actions/checkout@v4
        with:
          submodules: true 
          fetch-depth: 0 

      # Todos los pasos de 'npm', 'chmod' y 'PATH' se han eliminado.
      
      # Añadimos una verificación simple para ver si Sass funciona
      - name: Verify Sass Installation
        run: sass --version
          
      - name: Setup Pages 
        id: pages
        uses: actions/configure-pages@v5 
        
      - name: Update Hugo Modules 
        run: hugo mod tidy 
        
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: | 
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" 
          
      - name: Upload artifact 
        uses: actions/upload-pages-artifact@v3 
        with:
          path: ./public

  deploy: # El trabajo de despliegue no cambia
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4