# Archivo: .github/workflows/deploy.yml
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Instalar Hugo y Sass usando SNAP (como pide el README)
      - name: Install Hugo (Extended) and Dart Sass
        run: |
          echo "Instalando Hugo y Dart Sass usando snap..."
          # El README pide 'sudo snap install dart-sass hugo'
          # Nos aseguramos de que Hugo sea 'extended' como también pide el README
          sudo snap install hugo --channel=extended
          sudo snap install dart-sass

      # 2. Verificar que se instalaron
      - name: Verify Installations
        run: |
          echo "Verificando Hugo:"
          hugo version
          echo "Verificando Sass:"
          sass --version
          
      # 3. Descargar tu código
      - name: Checkout code 
        uses: actions/checkout@v4
        with:
          submodules: true 
          fetch-depth: 0 

      # 4. Configurar GitHub Pages
      - name: Setup Pages 
        id: pages
        uses: actions/configure-pages@v5 
        
      # 5. Descargar el tema Paige (Hugo Modules)
      - name: Update Hugo Modules 
        run: hugo mod tidy 
        
      # 6. Construir el sitio
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: | 
          # El README usa este comando de build:
          hugo --environment production --minify --baseURL "${{ steps.pages.outputs.base_url }}/" 
          
      # 7. Subir el artefacto
      - name: Upload artifact 
        uses: actions/upload-pages-artifact@v3 
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4