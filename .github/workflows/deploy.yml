# Archivo: .github/workflows/deploy.yml
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.151.2 # ¡Verifica que esta sea tu versión!
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb \
          && sudo dpkg -i ${{ runner.temp }}/hugo.deb          
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
      - name: Install Dart Sass via npm
        run: sudo npm install -g sass
      - name: Add npm bin to PATH
        run: echo "$(npm bin -g)" >> $GITHUB_PATH
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true 
          fetch-depth: 0 
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5 
      # - name: Install node dependencies (si tuvieras assets que lo necesiten)
      #   run: npm install # Descomenta si usas JS que requiera npm
      - name: Update Hugo Modules
        run: hugo mod tidy 
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: | # <- INDENTACIÓN CORREGIDA AQUÍ
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" 
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4