# Archivo: .github/workflows/deploy.yml
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.151.2
      # Definimos una versión estable de Dart Sass
      SASS_VERSION: 1.77.8 
    steps:
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }}
          extended: true

      # --- ESTA ES LA NUEVA SOLUCIÓN ---
      - name: Setup Dart Sass (Manual Install)
        run: |
          echo "Descargando Dart Sass v${{ env.SASS_VERSION }}"
          # 1. Descarga el archivo de la release oficial de GitHub
          curl -LJO "https://github.com/sass/dart-sass/releases/download/${{ env.SASS_VERSION }}/dart-sass-${{ env.SASS_VERSION }}-linux-x64.tar.gz"
          
          # 2. Descomprime el archivo
          tar -xzf "dart-sass-${{ env.SASS_VERSION }}-linux-x64.tar.gz"
          
          # 3. Añade la carpeta 'dart-sass' (que contiene el ejecutable) al GITHUB_PATH
          echo "Añadiendo $(pwd)/dart-sass al PATH"
          echo "$(pwd)/dart-sass" >> $GITHUB_PATH
      # --- FIN DE LA SOLUCIÓN ---

      - name: Checkout code 
        uses: actions/checkout@v4
        with:
          submodules: true 
          fetch-depth: 0 
          
      - name: Verify Sass Installation
        run: |
          echo "Verificando la instalación de Sass:"
          which sass
          sass --version
          
      - name: Setup Pages 
        id: pages
        uses: actions/configure-pages@v5 
        
      - name: Update Hugo Modules 
        run: hugo mod tidy 
        
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: | 
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" 
          
      - name: Upload artifact 
        uses: actions/upload-pages-artifact@v3 
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4