# Archivo: .github/workflows/deploy.yml
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.151.2 # ¡Verifica tu versión!
    steps:
      - name: Setup Hugo # Instala Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          version: ${{ env.HUGO_VERSION }}
          extended: true

      - name: Set up Node.js # Prepara Node/npm
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: Install Dart Sass via npm (no sudo) # Instala Sass globalmente sin sudo
        run: npm install -g sass

      - name: Add npm bin to PATH # Añade la carpeta global de npm al PATH
        run: echo "$(npm bin -g)" >> $GITHUB_PATH

      # --- PASO DE VERIFICACIÓN CLAVE ---
      - name: Verify Sass Installation # Comprueba si Sass es ejecutable
        run: sass --version 
      # --- FIN PASO DE VERIFICACIÓN ---

      - name: Checkout code # Descarga tu código
        uses: actions/checkout@v4
        with:
          submodules: true 
          fetch-depth: 0 

      - name: Setup Pages # Configura GitHub Pages
        id: pages
        uses: actions/configure-pages@v5 

      - name: Update Hugo Modules # Actualiza módulos del tema
        run: hugo mod tidy 

      - name: Build with Hugo # Construye el sitio
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: | 
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" 

      - name: Upload artifact # Sube el resultado (/public)
        uses: actions/upload-pages-artifact@v3 
        with:
          path: ./public

  deploy: # Trabajo de despliegue (sin cambios)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4