# Archivo: .github/workflows/deploy.yml
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.151.2 # ¡Verifica que esta sea tu versión!
    steps:
      # --- USA ESTA ACCIÓN PARA INSTALAR HUGO EXTENDED ---
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3 # Acción dedicada para Hugo
        with:
          version: ${{ env.HUGO_VERSION }}
          extended: true # ¡MUY IMPORTANTE! Asegura la versión con Sass

      # --- PASOS ANTERIORES DE INSTALACIÓN MANUAL ELIMINADOS ---

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: true 
          fetch-depth: 0 
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5 
      # - name: Install node dependencies (si tuvieras assets que lo necesiten)
      #   run: npm install 
      - name: Update Hugo Modules
        run: hugo mod tidy 
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: | 
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" 
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3 
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4