# Archivo: .github/workflows/deploy.yml
name: Deploy Hugo site to Pages

on:
  push:
    branches:
      - main 
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.151.2 # Usará esta versión
    steps:
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ env.HUGO_VERSION }} # <-- CORRECCIÓN #1
          extended: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 

      - name: Checkout code 
        uses: actions/checkout@v4
        with:
          submodules: true 
          fetch-depth: 0 

      - name: Initialize npm and Install Sass Locally 
        run: |
          npm init -y || true 
          npm install --save-dev sass
      
      - name: Dar permisos de ejecución a Sass # <-- CORRECCIÓN #2
        run: chmod +x ./node_modules/.bin/sass

      # --- Pasos de Depuración y PATH Explícito (Ahora deberían funcionar) ---
      - name: Check local Sass installation
        run: |
          echo "Listing node_modules/.bin:"
          ls -la node_modules/.bin
          echo "Attempting to get Sass version via relative path:"
          ./node_modules/.bin/sass --version
          
      - name: Add local node_modules bin to PATH explicitly
        run: echo "$(pwd)/node_modules/.bin" >> $GITHUB_PATH

      - name: Verify PATH and Sass again
        run: |
          echo "Current PATH: $PATH"
          echo "Which sass:"
          which sass
          echo "Attempting to get Sass version directly:"
          sass --version
      # --- Fin Pasos de Depuración ---
          
      - name: Setup Pages 
        id: pages
        uses: actions/configure-pages@v5 
        
      - name: Update Hugo Modules 
        run: hugo mod tidy 
        
      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
        run: | 
          hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/" 
          
      - name: Upload artifact 
        uses: actions/upload-pages-artifact@v3 
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build 
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4